name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      # Conteúdo enxadrístico é conferido contra o motor de regras antes de subir.
      - name: Validação de conteúdo
        run: npm run content:validate
      - name: Build
        run: npm run build
