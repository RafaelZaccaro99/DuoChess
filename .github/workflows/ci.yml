name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      # Gate SOURCE_REVIEW + a parte do ENGINE_REVIEW que o motor de regras cobre.
      - name: Conteúdo — regras e fontes
        run: npm run content:validate
      # Resto do ENGINE_REVIEW: unicidade da solução e erro previsível que erra
      # mesmo. Passo próprio porque é lento — sobe Stockfish e analisa posição a
      # posição. É o revisor enxadrístico do projeto; não pode ser opcional.
      - name: Conteúdo — engine
        run: npm run content:engine
        env:
          ENGINE_DEPTH: 14
      # O conteúdo gerado é commitado. Se regerar mudar algo, o gerador deixou de
      # ser determinístico — e aí o diff em git vira ruído que ninguém revisa.
      - name: Conteúdo — gerador é determinístico
        run: |
          npm run content:gerar
          git diff --exit-code -- src/content/gerado/             || (echo "::error::o gerador não é determinístico: regerar mudou o conteúdo commitado" && exit 1)
      - name: Build
        run: npm run build
